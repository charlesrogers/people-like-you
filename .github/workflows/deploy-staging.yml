name: Deploy Staging
on:
  push:
    branches: [staging]
    paths-ignore: ['*.md', 'docs/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Get previous SHA for rollback
        id: prev
        run: echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/charlesrogers/people-like-you-app:staging
            ghcr.io/charlesrogers/people-like-you-app:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run database migrations
        # NOTE: staging and production share ONE Supabase database, so a staging
        # migration IS a production migration. Migrations must be additive/idempotent
        # (IF NOT EXISTS / IF EXISTS). This closes the gap where staging deploys
        # skipped migrations (found 2026-07, blocked migration 014). See EXECUTION.md T5.
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 95.216.205.160 >> ~/.ssh/known_hosts 2>/dev/null
          for f in $(ls migrations/*.sql 2>/dev/null | sort); do
            NAME=$(basename "$f")
            APPLIED=$(ssh root@95.216.205.160 "docker exec supabase-db psql -U postgres -d postgres -t -c \"SELECT 1 FROM _migrations WHERE name='$NAME'\"" 2>/dev/null | tr -d ' ')
            if [ "$APPLIED" = "1" ]; then
              echo "Skip: $NAME (already applied)"
              continue
            fi
            echo "Applying: $NAME"
            ssh root@95.216.205.160 "docker exec -i supabase-db psql -U postgres -d postgres" < "$f" 2>&1 || echo "Warning: $NAME had errors (may be IF NOT EXISTS)"
            ssh root@95.216.205.160 "docker exec supabase-db psql -U postgres -d postgres -c \"INSERT INTO _migrations (name) VALUES ('$NAME') ON CONFLICT DO NOTHING\"" 2>/dev/null
          done
          echo "Migrations complete"
      - name: Deploy, verify, rollback if needed
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: lnqcrc8fr4bmge7200f4pc2l
          HEALTH_URL: https://staging-ply.imprevista.com/api/health
          PREV_SHA: staging-${{ steps.prev.outputs.sha }}
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1486969921542946887/SAD4fP0-JaPrGmnEs_W2WIZmiRMQt1T2kQSbgnNenTTjnRq0YcqNkkLsKdvyPJ5pAA6y
        run: |
          curl -sf -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "http://95.216.205.160:8000/api/v1/deploy?uuid=$APP_UUID&force=true"
          echo "Deploy triggered"

          HEALTHY=false
          for i in $(seq 1 20); do
            sleep 10
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
            echo "Health check $i/20: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              break
            fi
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "Deploy verified healthy"
            exit 0
          fi

          echo "::error::Staging health check failed — rolling back to $PREV_SHA"
          curl -sf -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"$PREV_SHA\"}" \
            "http://95.216.205.160:8000/api/v1/applications/$APP_UUID"
          curl -sf -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "http://95.216.205.160:8000/api/v1/deploy?uuid=$APP_UUID&force=true"
          sleep 30
          curl -sf -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"docker_registry_image_tag": "staging"}' \
            "http://95.216.205.160:8000/api/v1/applications/$APP_UUID"

          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**ROLLBACK** ${GITHUB_REPOSITORY} (staging): deploy \`${GITHUB_SHA:0:7}\` failed. Rolled back to \`${PREV_SHA:0:7}\`.\"}" \
            "$DISCORD_WEBHOOK" || true
          exit 1
